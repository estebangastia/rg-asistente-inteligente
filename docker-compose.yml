services:
  # Base de datos PostgreSQL con la extensión pgvector preinstalada
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rg_user
      POSTGRES_PASSWORD: rg2026
      POSTGRES_DB: rg_asistente
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rg_user -d rg_asistente"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplicación FastAPI
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://rg_user:rg2026@db:5432/rg_asistente
      OPENAI_API_KEY: sk-demo-no-se-usa-en-modo-demo
      # Modelo de lenguaje: completar LLM_API_KEY (por ejemplo, una key gratuita de Groq)
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_API_KEY: ${LLM_API_KEY:-}
      SECRET_KEY: clave_secreta_desarrollo_tfg_rg_sa_2026_min32chars
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_HOURS: 8
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      EMAIL_FROM: notificaciones@rg-sa.com.ar
    ports:
      - "8000:8000"
    volumes:
      - backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  backups:
